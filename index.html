<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños, eleazar!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .tarjeta-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 {
            font-size: 26px;
            color: #ffd700;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            color: #f1f1f1;
        }
        .foto-marco {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffd700;
            margin: 15px auto;
            display: none;
        }
    </style>
</head>
<body>
    <div class="tarjeta-container">
        <!-- Elemento visual segun modelo -->
        <div style="font-size: 50px; margin-bottom: 10px;">
            🐻
        </div>
        
        <h1>¡Feliz Cumpleaños, eleazar!</h1>
        
        <!-- Foto opcional -->
        
        
        <p>felicidades</p>
        
        <!-- Audio de fondo opcional -->
        
        <audio autoplay loop>
            <source src="https://www.bensound.com/bensound-music/bensound-ukulele.mp3" type="audio/mpeg">
            Tu navegador no soporta audio.
        </audio>
        
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un detalle especial para ti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }
        .tarjeta {
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            z-index: 2;
            margin-top: 80px;
        }
        h2 { font-size: 1.2rem; color: #e0e0e0; margin-bottom: 10px; letter-spacing: 2px; text-transform: uppercase; }
        h1 { font-size: 2.2rem; margin-bottom: 20px; }
        p { font-size: 1.1rem; line-height: 1.6; color: #f0f0f0; margin-bottom: 25px; }
        .firma { font-style: italic; font-size: 1rem; color: #ffb6c1; }
        
        
        body {
            background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
            color: #ffffff;
        }
        .elemento-fondo {
            position: absolute;
            top: 12%;
            font-size: 5rem;
            z-index: 1;
            animation: rebotar 2s infinite alternate;
        }
        @keyframes rebotar {
            0% { transform: translateY(0px) rotate(-5deg); }
            100% { transform: translateY(-20px) rotate(5deg); }
        }
        .tarjeta {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #ff007f;
        }
        h1 { color: #00f2fe; text-shadow: 0 0 15px rgba(0, 242, 254, 0.8); }
        .icono { font-size: 2.5rem; margin-top: 15px; display: inline-block; }
    
    </style>
</head>
<body>

    <div class="elemento-fondo">🎂</div>

    <div class="tarjeta">
        <h2>Hola, estefania</h2>
        <h1>Feliz Cumpleaños</h1>
        <p>"que lo disfrute"</p>
        <div class="firma">Con todo mi cariño, <br><strong>tu esposo</strong></div>
        <div class="icono">🎉🎈🎁</div>
    </div>

</body>
</html>
